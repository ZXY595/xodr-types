[package]
name = "xodr-types"
version = "0.2.1+OpenDRIVEv1.9.0"
description = "Rust types for ASAM OpenDRIVE 1.9 XML nodes"
edition = "2024"
resolver = "3"
license = "MIT"
repository = "https://github.com/ZXY595/xodr-types"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
